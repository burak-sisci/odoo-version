name: Upstream Odoo
description: >-
  Check out the pinned upstream/odoo submodule (shallow). Its git objects are
  cached per upstream commit, so later runs skip the download.
runs:
  using: composite
  steps:
    - name: Pinned upstream commit
      id: pin
      shell: bash
      run: echo "sha=$(git rev-parse HEAD:upstream/odoo)" >> "$GITHUB_OUTPUT"
    - name: Upstream git objects cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .git/modules/upstream/odoo
        key: upstream-odoo-${{ steps.pin.outputs.sha }}
    - name: Check out upstream/odoo
      shell: bash
      # Reuses the cached objects when present; fetches only on a cache miss.
      run: git submodule update --init --depth 1 upstream/odoo
