# CI (T1.10, D-020): GitHub Actions, free standard runners for public repositories.
# Order of the plan: documents -> lint -> secrets -> module tests.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      modules:
        description: >-
          Also test these modules, comma-separated (for example upstream
          modules, to get a Linux reference result)
        required: false
        default: ""

permissions:
  contents: read

# A new push cancels the older run of the same branch; manual runs have a group of their own.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Documents, lint, secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the whole history
          persist-credentials: false
      # ruff.toml extends upstream's rule set; the guideline copy is compared with upstream.
      - uses: ./.github/actions/submodules
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Documents
        run: python tools/check_docs.py

      - name: Tests of the project tools
        run: python -m unittest discover -s tools/tests -v

      # Ratchet: raised with each batch of translations, never lowered (T3.6; gate: 95, reached 100)
      - name: Turkish translation coverage of the package modules
        run: python tools/po_coverage.py report --quiet --min 100

      - name: Hook environments cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Lint (ruff, pylint-odoo, module rules)
        run: |
          python -m pip install --quiet "$(grep '^pre-commit==' requirements-dev.txt)"
          SKIP=check-docs pre-commit run --all-files --show-diff-on-failure

      - name: Secrets (gitleaks, whole history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .

      - name: Odoo AI guidelines copy
        run: python tools/sync_skills.py --check

  tests:
    name: Module tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway database of this job only; not a secret.
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/submodules
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            upstream/odoo/requirements.txt

      - name: Python environment
        run: |
          # Build dependencies of psycopg2 and python-ldap (no wheels for these pins)
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpq-dev libldap2-dev libsasl2-dev
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --prefer-binary -r requirements-dev.txt

      - name: Local configuration
        run: |
          echo "OV_HOME=$RUNNER_TEMP/ov-home" >> "$GITHUB_ENV"
          printf 'PGHOST=localhost\nPGPORT=5432\nPGUSER=odoo\nPGPASSWORD=odoo-ci\n' > .env
          OV_HOME="$RUNNER_TEMP/ov-home" python tools/odoo_conf.py

      # The template must keep producing a module that installs, passes its test and lint.
      - name: Module template
        run: |
          python tools/new_module.py ov_ci_sample --summary "CI template check"
          python tools/check_modules.py
          .venv/bin/ruff check addons
          .venv/bin/pylint addons/ov_ci_sample

      - name: Module tests (addons/, ports/)
        run: |
          modules=$(find addons ports -name __manifest__.py -printf '%h\n' 2>/dev/null | xargs -rn1 basename | sort | paste -sd, -)
          echo "modules: $modules"
          python tools/run_tests.py "$modules" --db ov_test_ci -v

      # M2 (T2.6, T2.7): no brand leak and no request to the publisher with the
      # apps of the first packages (PLAN.md §3); the ov_brand_* parts of these
      # apps install with them. The external request test runs all their
      # scheduled jobs and opens the main pages.
      - name: Brand leak and external request tests with the MVP apps
        env:
          MVP_APPS: sale_management,purchase,stock,crm,mrp,mrp_subcontracting,maintenance,contacts,calendar,l10n_tr
        run: python tools/run_tests.py "ov_brand,$MVP_APPS" --db ov_test_mvp --tags ov_brand_leak,ov_external -v

      # T3.7: the Turkish documents printed by the two PDF engines (USER_TASKS K18).
      # Debian packages of the upstream releases, checked by their digest.
      - name: PDF engines
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo wkhtmltox.deb https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          curl -fsSLo paper-muncher.deb https://github.com/odoo/paper-muncher/releases/download/v0.9.0/paper-muncher_v0.9.0_noble_amd64.deb
          sha256sum -c - <<'EOF'
          4f723b2691ad8638a9df960e0421d346d7315083e3583a334f33362280ddba15  wkhtmltox.deb
          ea7d30c3762beb47799968d7d439d0c3efc77ddff1f48bd151f9edc42faa2c9d  paper-muncher.deb
          EOF
          sudo apt-get install -y -qq --no-install-recommends ./wkhtmltox.deb ./paper-muncher.deb
          wkhtmltopdf --version
          dpkg -L paper-muncher | grep /bin/

      - name: Turkish documents in PDF
        env:
          OV_PDF_ENGINES: wkhtmltopdf,paper-muncher
          OV_PDF_DIR: ${{ runner.temp }}/pdf
        run: python tools/run_tests.py ov_l10n_tr_sale,ov_l10n_tr_stock,base_report_paper_muncher --db ov_test_pdf --tags ov_pdf -v

      - name: Printed PDFs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: turkish-documents-pdf
          path: ${{ runner.temp }}/pdf
          if-no-files-found: ignore
          retention-days: 14

      - name: Reference tests (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.modules != ''
        env:
          MODULES: ${{ inputs.modules }}
        run: python tools/run_tests.py "$MODULES" --db ov_test_reference -v

      - name: Test log tail
        if: failure()
        run: tail -n 80 "$OV_HOME"/logs/tests/*.log
